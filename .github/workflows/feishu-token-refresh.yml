name: Feishu Token Refresh

# refresh_token 典型有效期约 7 天；每周一/四各跑一次，避免过期。
on:
  schedule:
    - cron: "0 2 * * 1,4"
  workflow_dispatch:
    inputs:
      tenant_only:
        description: "Only refresh tenant_access_token"
        type: boolean
        default: false
      update_secret:
        description: "Write rotated FEISHU_REFRESH_TOKEN back to GitHub Secrets"
        type: boolean
        default: true

jobs:
  refresh:
    name: Refresh Feishu tokens
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-feishu.txt

      - name: Refresh tokens
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_REFRESH_TOKEN: ${{ secrets.FEISHU_REFRESH_TOKEN }}
          FEISHU_SECRETS_PAT: ${{ secrets.FEISHU_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_APP_ID:-}" ] || [ -z "${FEISHU_APP_SECRET:-}" ]; then
            echo "Missing FEISHU_APP_ID / FEISHU_APP_SECRET secrets."
            echo "Create a Feishu custom app and add these repository secrets first."
            exit 1
          fi

          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.tenant_only }}" = "true" ]; then
              ARGS+=(--tenant-only)
            fi
            if [ "${{ inputs.update_secret }}" = "true" ]; then
              ARGS+=(--update-github-secret)
            fi
          else
            # Scheduled runs: rotate refresh_token and sync secret when possible.
            ARGS+=(--update-github-secret)
          fi

          # Prefer full user+tenant refresh; allow tenant-only survival if user token absent.
          if ! python -m feishu.refresh_tokens --fail-without-refresh-token "${ARGS[@]}"; then
            echo "Full refresh failed; attempting tenant-only health check."
            python -m feishu.refresh_tokens --tenant-only
          fi
